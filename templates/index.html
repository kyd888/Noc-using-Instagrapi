<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Profile Analysis</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
</head>
<body>
    <h1>Instagram Profile Analysis</h1>
    
    <form id="profile-form">
        <input type="text" id="username" placeholder="Enter Instagram username" required>
        <button type="submit">Analyze Profile</button>
    </form>
    
    <div id="status-message"></div>

    <script>
        $(document).ready(function() {
            var socket = io();

            // Handle form submission
            $('#profile-form').submit(function(event) {
                event.preventDefault();
                const username = $('#username').val();

                // Make a POST request to start the analysis
                $.post('/analyze_profile', { username: username }, function(response) {
                    $('#status-message').text(response.status);
                });
            });

            // Listen for the 'analysis_start' event
            socket.on('analysis_start', function(data) {
                $('#status-message').text('Analyzing profile: ' + data.username + '...');
            });

            // Listen for the 'analysis_complete' event
            socket.on('analysis_complete', function(data) {
                $('#status-message').text('Profile analysis completed for: ' + data.username);
            });
        });
    </script>
</body>
</html>
